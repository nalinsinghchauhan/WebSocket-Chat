services:
  # Web Service (Spring Boot Application)
  # Using Docker for reliable Java/Maven builds
  - type: web
    name: websocket-chat
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: websocket-chat-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: websocket-chat-db
          property: username
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: websocket-chat-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 86400000
      # PORT is automatically set by Render, no need to specify

databases:
  # PostgreSQL Database (Render's native database)
  # NOTE: Render offers PostgreSQL, not MySQL. To use this:
  # 1. Update pom.xml to use PostgreSQL dependency instead of MySQL
  # 2. Update application.properties to use PostgreSQL dialect
  # OR use an external MySQL service like PlanetScale, Railway, or Aiven
  - name: websocket-chat-db
    databaseName: websocket_chat
    user: websocket_user
    plan: free

